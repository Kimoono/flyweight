<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flyweight — host</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #0b0e14; --panel: #151a23; --ink: #e8ecf1; --dim: #9aa3ad; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 1px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  button { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; color: #000; }
  .status { color: var(--dim); font-size: 14px; margin-left: auto; }
  .results { background: var(--panel); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
  .log { color: var(--dim); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<h1>HOST <small class="status" id="status" style="font-weight:400">connecting…</small></h1>
<div class="results" id="heat">
  <div class="bar" style="margin:0 0 8px">
    <button id="start" style="background:#22c55e">START HEAT (90 s)</button>
    <button id="stop" style="background:#374151;color:#e8ecf1">STOP</button>
    <button id="clear" style="background:#374151;color:#e8ecf1">CLEAR SEATS</button>
    <button id="resetlb" style="background:#374151;color:#e8ecf1">RESET LEADERBOARD</button>
    <span class="status" id="heat-status"></span>
  </div>
  <div class="bar" style="margin:0 0 8px">
    <span style="color:var(--dim);font-size:14px">GAME</span>
    <button class="mode" data-mode="duel">DUEL · 2 players</button>
    <button class="mode" data-mode="quad">4 PLAYERS · quadrants</button>
    <span class="status">switching clears the seats (only between heats)</span>
  </div>
  <div id="seats" style="font-size:16px;margin:6px 0"></div>
  <div id="lb" class="log"></div>
</div>
<script type="module">
import { connect } from "/static/ws.js";
const $ = (id) => document.getElementById(id);
const sock = connect({
  onOpen() { $("status").textContent = "connected"; },
  onClose() { $("status").textContent = "reconnecting…"; },
  onMessage(m) { if (m.type === "state") renderHeat(m); },
});
for (const [id, action] of [["start", "start"], ["stop", "stop"], ["clear", "clear_players"], ["resetlb", "reset_scores"]])
  $(id).addEventListener("click", () => { if (action === "reset_scores" && !confirm("Reset the leaderboard?")) return; sock.send({ type: "heat", action }); });
for (const b of document.querySelectorAll(".mode")) b.addEventListener("click", () => sock.send({ type: "heat", action: b.dataset.mode }));
let lastHeat = 0;
function renderHeat(m) {
  if (Date.now() - lastHeat < 250) return; lastHeat = Date.now();
  const h = m.heat, sc = m.world.score;
  const busy = h.phase === "playing" || h.phase === "countdown";
  for (const b of document.querySelectorAll(".mode")) {
    const on = b.dataset.mode === h.mode;
    b.style.background = on ? "#e8ecf1" : "#374151"; b.style.color = on ? "#000" : "#e8ecf1"; b.disabled = busy && !on; b.style.opacity = b.disabled ? .4 : 1;
  }
  const scores = h.zones.map((z) => sc[z.id]).join(" – ");
  $("heat-status").textContent = h.phase === "playing" ? `playing · ${Math.ceil(h.time_left)} s left · ${scores}` : h.phase === "countdown" ? "countdown" : h.phase === "over" ? `over · ${h.winner}` : "lobby";
  $("seats").innerHTML = h.zones.map((z) => `<span style="color:${z.colour};font-weight:800">${z.label}</span> ${h.players[z.id] || "<i style='color:#6b7280'>empty seat</i>"}`).join(" &nbsp;·&nbsp; ");
  $("lb").textContent = h.leaderboard.length ? "Leaderboard: " + h.leaderboard.map((r) => `${r.name} ${r.wins}W/${r.points}pts`).join(", ") : "No heats played yet. Players pick a seat on their phone, then START HEAT.";
}
</script>
</body>
</html>
